<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salud Centro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body data-pagina="inicio" class="bg-light">
<main class="container py-4">

  <h1>Salud Centro</h1>

  <form id="cita" class="card p-4">
    <div class="row g-3">

      <div class="col-md-6">
        <label for="paciente" class="form-label">Paciente</label>
        <input id="paciente" name="paciente" class="form-control" required minlength="3" maxlength="60">
      </div>

      <div class="col-md-6">
        <label for="correo" class="form-label">Correo</label>
        <input id="correo" name="correo" type="email" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label for="especialidad" class="form-label">Especialidad</label>
        <select id="especialidad" name="especialidad" class="form-select" required>
          <option value="">Selecciona</option>
          <option value="Lima">Consulta General</option>
          <option value="Cusco">Odontologia</option>
          <option value="">Nutrición</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="fecha" class="form-label">Fecha</label>
        <input id="fecha" name="peso" type="date" class="form-control" min="2026-09-29" required>
      </div>
    </div>

      <div class="col-md-6">
        <label for="horario" class="form-label">Horarios disponibles</label>
        <select id="horario" name="horario" class="form-select" required>
          <option value="">Selecciona</option>
          <option value="Lima">9:00 am</option>
          <option value="Cusco">10:00 am</option>
          <option value="Puno">11:00 am</option>
          <option value="Lima">15:00 am</option>
          <option value="Cusco">16:00 am</option>
        </select>
      </div>





    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Registrar</button>
      <button type="reset" class="btn btn-secondary">Limpiar</button>
    </div>

  </form>


</main>
</body>


</html>
